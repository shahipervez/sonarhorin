# Sonarhorin — SPA + API reverse proxy. Put TLS in front (Caddy, Cloudflare or certbot) in production.
server_tokens off;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# --- compression. The Docker build pre-compresses dist/ (*.gz), served by gzip_static with no CPU
# cost; everything else (API JSON, …) is gzipped on the fly. Brotli needs the ngx_brotli module,
# which the stock nginx image lacks; Cloudflare/Vercel in front add brotli automatically.
gzip on;
gzip_static on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript text/javascript
           application/xml application/rss+xml application/manifest+json image/svg+xml font/ttf font/otf;

server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 12m;

  # security headers for the app shell (repeated in every location that adds its own header)
  include /etc/nginx/security_headers.conf;

  # hashed Vite assets: cache forever
  location ^~ /assets/ {
    try_files $uri =404;
    include /etc/nginx/security_headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  # public/ media (not hashed — same filename can change): cache for a week, then revalidate
  location ~* ^/(?!api/|media/|static/|admin/)(.*\.(mp4|webm|webp|png|jpe?g|gif|svg|ico|woff2?))$ {
    try_files $uri =404;
    include /etc/nginx/security_headers.conf;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
  }
  # PWA service worker + manifest: must never be cached, or updates never reach users
  location ~ ^/(sw\.js|push-sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
    try_files $uri =404;
    include /etc/nginx/security_headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # login / register / refresh: stricter rate limit
  location ~ ^/api/auth/(login|register|refresh)/ {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://backend:8000;
    include /etc/nginx/proxy_params_sh;
  }
  # streaming coach chat: no buffering
  location ~ ^/api/career/kits/\d+/chat/$ {
    proxy_pass http://backend:8000;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
    include /etc/nginx/proxy_params_sh;
  }
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://backend:8000;
    proxy_read_timeout 150s;
    include /etc/nginx/proxy_params_sh;
  }
  location /admin/ { proxy_pass http://backend:8000; include /etc/nginx/proxy_params_sh; }
  location /static/ { proxy_pass http://backend:8000; }
  location /media/ { proxy_pass http://backend:8000; }

  # SPA fallback: index.html is always revalidated so a new deploy is picked up immediately
  location / {
    try_files $uri /index.html;
    include /etc/nginx/security_headers.conf;
    add_header Cache-Control "no-cache" always;
  }
}
