# Sonarhorin — SPA + API reverse proxy. Put TLS in front (Caddy, Cloudflare or certbot) in production.
server_tokens off;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 12m;

  # --- security headers for the app shell
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://api.github.com; frame-src https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  # hashed assets: cache forever
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location /stories/ { expires 30d; try_files $uri =404; }
  # PWA service worker + manifest: always revalidate so updates roll out
  location ~ ^/(sw\.js|push-sw\.js|registerSW\.js|manifest\.webmanifest)$ { expires -1; try_files $uri =404; }

  # login / register / refresh: stricter rate limit
  location ~ ^/api/auth/(login|register|refresh)/ {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://backend:8000;
    include /etc/nginx/proxy_params_sh;
  }
  # streaming coach chat: no buffering
  location ~ ^/api/career/kits/\d+/chat/$ {
    proxy_pass http://backend:8000;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
    include /etc/nginx/proxy_params_sh;
  }
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://backend:8000;
    proxy_read_timeout 150s;
    include /etc/nginx/proxy_params_sh;
  }
  location /admin/ { proxy_pass http://backend:8000; include /etc/nginx/proxy_params_sh; }
  location /static/ { proxy_pass http://backend:8000; }
  location /media/ { proxy_pass http://backend:8000; }

  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
