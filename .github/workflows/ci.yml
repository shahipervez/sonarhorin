name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    env:
      # Never start the in-process scraper thread in CI
      ENABLE_INPROCESS_SCHEDULER: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deploy checklist (production-like dummy env)
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-dummy-secret-key-not-used-anywhere-0123456789abcdefghijklmnop
        run: python manage.py check --deploy --fail-level WARNING

      - name: Missing migrations?
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test --noinput

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Unit tests (Vitest, if configured)
        run: npm test --if-present
        env:
          CI: "true"

      - name: Lint (if configured)
        run: npm run lint --if-present

      - run: npm run build

      - name: Bundle size report
        run: |
          echo "### Frontend build" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh dist dist/assets >> "$GITHUB_STEP_SUMMARY"
          ls -S -l dist/assets | head -n 12 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E (Playwright, optional)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Advisory until the suite is stable: a red e2e run is reported but does not block merges.
    continue-on-error: true
    env:
      ENABLE_INPROCESS_SCHEDULER: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Is there an e2e script?
        id: detect
        working-directory: frontend
        run: |
          if node -e "process.exit(require('./package.json').scripts?.e2e ? 0 : 1)"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No \`e2e\` script in frontend/package.json — skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start seeded backend on :8000
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py seed --demo-user
          python manage.py seed_data || true   # fixture with demo users/companies/jobs
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > ../backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/api/ && break
            curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/admin/login/ | grep -q 200 && break
            sleep 1
          done

      - name: Install frontend + Playwright browser
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run e2e
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run e2e --if-present

      - name: Backend log
        if: failure() && steps.detect.outputs.present == 'true'
        run: tail -n 200 backend.log || true

      - uses: actions/upload-artifact@v4
        if: failure() && steps.detect.outputs.present == 'true'
        with:
          name: playwright-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
