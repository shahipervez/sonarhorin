version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      django:
        patterns: ["django", "djangorestframework*", "django-*"]
      python-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom", "react-router*", "@types/react*"]
      vite:
        patterns: ["vite", "@vitejs/*", "vite-plugin-*", "vitest", "@vitest/*"]
      test:
        patterns: ["@playwright/*", "@testing-library/*", "jsdom"]
      npm-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
