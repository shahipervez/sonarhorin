<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Galada;src:url(galada.woff2) format("woff2");}
@font-face{font-family:Hind;font-weight:700;src:url(hind700.woff2) format("woff2");}
@font-face{font-family:Hind;font-weight:600;src:url(hind600.woff2) format("woff2");}
@font-face{font-family:HindL;font-weight:700;src:url(hindl700.woff2) format("woff2");}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0;
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = (k) => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eout = (k) => 1 - Math.pow(1 - k, 3);
const back = (k) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function glow(x, y, r, col, a = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore();
}
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function shade(hex, k) { // k<0 darker, k>0 lighter
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = (c) => Math.round(k < 0 ? c * (1 + k) : c + (255 - c) * k);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function bgGrad(top, bot) { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, top); g.addColorStop(1, bot); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
function dust(t, n, col, seed = 7, speed = 20) {
  const r = rnd(seed);
  for (let i = 0; i < n; i++) {
    const x = r() * W, y0 = r() * H, s = 1 + r() * 2.5, ph = r() * TAU;
    const y = ((y0 - t * speed * (0.5 + r())) % H + H) % H;
    ctx.globalAlpha = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t * 2 + ph));
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x + Math.sin(t + ph) * 8, y, s, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function shadowEll(x, y, w, a = .25) { ctx.save(); ctx.fillStyle = `rgba(0,0,0,${a})`; ctx.beginPath(); ctx.ellipse(x, y, w, w * .16, 0, 0, TAU); ctx.fill(); ctx.restore(); }

/* ---------- characters ---------- */
function person(x, y, s, o = {}) {
  // seated/standing simple friendly figure, origin at hip center
  const skin = o.skin || '#C98B62', hair = o.hair || '#1B1B22', shirt = o.shirt || '#3B82F6';
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  // legs
  ctx.fillStyle = o.pants || '#22263A';
  if (o.seated) { rr(-22, -4, 44, 18, 8); ctx.fill(); rr(-22, 6, 16, 46, 7); ctx.fill(); rr(6, 6, 16, 46, 7); ctx.fill(); }
  else { const k = o.walk ? Math.sin(o.walk) * 10 : 0; rr(-18 + k * .3, -4, 15, 62, 7); ctx.fill(); rr(3 - k * .3, -4, 15, 62, 7); ctx.fill(); }
  // torso
  ctx.fillStyle = shirt; rr(-28, -78, 56, 80, 22); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.12)'; rr(-28, -78, 20, 80, 18); ctx.fill();
  // arms
  ctx.strokeStyle = shirt; ctx.lineCap = 'round'; ctx.lineWidth = 15;
  const ar = o.armUp || 0;
  ctx.beginPath(); ctx.moveTo(-24, -62); ctx.lineTo(-34, -24); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(24, -62); ctx.lineTo(lerp(34, 10, ar), lerp(-24, -70, ar)); ctx.stroke();
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(-34, -22, 7, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(lerp(34, 10, ar), lerp(-22, -72, ar), 7, 0, TAU); ctx.fill();
  // neck/head
  ctx.fillStyle = skin; rr(-7, -90, 14, 14, 4); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -110, 24, 0, TAU); ctx.fill();
  ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(0, -114, 25, Math.PI * 1.02, Math.PI * 1.98); ctx.fill();
  rr(-25, -120, 50, 9, 5); ctx.fill();
  // face
  const look = o.look || 0;
  ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(-8 + look, -108, 2.6, 0, TAU); ctx.arc(8 + look, -108, 2.6, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#5a2e1c'; ctx.lineWidth = 2.2;
  ctx.beginPath();
  if (o.happy) ctx.arc(look, -100, 7, .15 * Math.PI, .85 * Math.PI); else { ctx.moveTo(-5 + look, -97); ctx.lineTo(5 + look, -97); }
  ctx.stroke();
  ctx.restore();
}

function deer(x, y, s, ph, col = '#FFC23D') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const g = ctx.createLinearGradient(-60, -60, 60, 40); g.addColorStop(0, '#FFE9A3'); g.addColorStop(1, col);
  ctx.fillStyle = g; ctx.strokeStyle = g; ctx.lineCap = 'round';
  // legs (gallop)
  ctx.lineWidth = 7;
  const L = (bx, by, a1, a2) => { ctx.beginPath(); ctx.moveTo(bx, by); const kx = bx + Math.sin(a1) * 22, ky = by + Math.cos(a1) * 22; ctx.lineTo(kx, ky); ctx.lineTo(kx + Math.sin(a2) * 22, ky + Math.cos(a2) * 22); ctx.stroke(); };
  L(-30, 0, .9 + Math.sin(ph) * .7, .2 + Math.sin(ph) * .5);
  L(-22, 2, .7 + Math.sin(ph + .6) * .7, .1 + Math.sin(ph + .6) * .5);
  L(26, 0, -.6 + Math.sin(ph + 2.6) * .8, .4 + Math.sin(ph + 2.6) * .5);
  L(34, 0, -.5 + Math.sin(ph + 3.2) * .8, .3 + Math.sin(ph + 3.2) * .5);
  // body
  ctx.beginPath(); ctx.ellipse(0, -8, 46, 20, -.05, 0, TAU); ctx.fill();
  // tail
  ctx.beginPath(); ctx.ellipse(-46, -16, 9, 5, -.6, 0, TAU); ctx.fill();
  // neck + head
  ctx.beginPath(); ctx.moveTo(28, -20); ctx.quadraticCurveTo(44, -40, 50, -58); ctx.lineTo(62, -52); ctx.quadraticCurveTo(52, -30, 40, -6); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(62, -60, 17, 10, .35, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(52, -70, 5, 9, -.6, 0, TAU); ctx.fill();
  // antlers
  ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(56, -70); ctx.quadraticCurveTo(50, -96, 64, -112); ctx.moveTo(53, -86); ctx.lineTo(40, -96); ctx.moveTo(57, -98); ctx.lineTo(48, -110);
  ctx.moveTo(60, -70); ctx.quadraticCurveTo(70, -92, 86, -100); ctx.moveTo(70, -86); ctx.lineTo(78, -104); ctx.stroke();
  // spots
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  [[-18, -14], [-4, -18], [10, -12], [-26, -4], [4, -4]].forEach(([a, b]) => { ctx.beginPath(); ctx.arc(a, b, 3, 0, TAU); ctx.fill(); });
  ctx.fillStyle = '#2a1a05'; ctx.beginPath(); ctx.arc(66, -63, 2.2, 0, TAU); ctx.fill();
  ctx.restore();
}

function deerMark(x, y, s, col = '#FFC23D') { // logo mark
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 40, s / 40); ctx.translate(-20, -20);
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  ctx.stroke(new Path2D('M14 15c-2-3-5-5-6-9M10 9l-4-1M12 12l-5 1M26 15c2-3 5-5 6-9M30 9l4-1M28 12l5 1'));
  ctx.fill(new Path2D('M13 15c2-1.5 4.5-2 7-2s5 .5 7 2c1 3-1 6-2.5 9.5L22 34c-.6 1.4-3.4 1.4-4 0l-2.5-9.5C14 21 12 18 13 15z'));
  ctx.fillStyle = '#0B0B10'; ctx.beginPath(); ctx.arc(17, 20, 1.3, 0, TAU); ctx.arc(23, 20, 1.3, 0, TAU); ctx.fill();
  ctx.restore();
}

function skyline(base, col, seed, lit, t = 0, litCol = '#FFD27A') {
  const r = rnd(seed); let x = -10;
  while (x < W + 20) {
    const w = 40 + r() * 70, h = 80 + r() * (H * .32);
    ctx.fillStyle = col; ctx.fillRect(x, base - h, w, h);
    if (lit) for (let wy = base - h + 12; wy < base - 10; wy += 16) for (let wx = x + 8; wx < x + w - 8; wx += 13) {
      const v = r(); if (v < lit) { ctx.globalAlpha = .5 + .5 * Math.sin(t * 1.5 + v * 40); ctx.fillStyle = litCol; ctx.fillRect(wx, wy, 5, 7); ctx.globalAlpha = 1; ctx.fillStyle = col; }
    }
    x += w + 3;
  }
}

function text(s, x, y, size, col, font = 'HindL', weight = 700, align = 'center', spacing = 0) {
  ctx.save(); ctx.font = `${weight} ${size}px ${font}`; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (spacing) ctx.letterSpacing = spacing + 'px';
  ctx.fillText(s, x, y); ctx.restore();
}
function chip(s, x, y, bg, fg, size = 20) {
  ctx.save(); ctx.font = `700 ${size}px HindL`; const w = ctx.measureText(s).width + size * 1.2;
  ctx.fillStyle = bg; rr(x - w / 2, y - size * .9, w, size * 1.8, size * .9); ctx.fill();
  ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y + 1); ctx.restore();
}

/* =================== INTRO (1280x720, 10s) =================== */
function intro(t) {
  ctx.fillStyle = '#05060B'; ctx.fillRect(0, 0, W, H);
  // ---- Beat A + B : tea stall (0 - 4.9)
  if (t < 4.9) {
    const z = 1 + .07 * eio(seg(t, 0, 4.6));
    ctx.save(); ctx.translate(W / 2, H * .62); ctx.scale(z, z); ctx.translate(-W / 2, -H * .62);
    bgGrad('#0B1030', '#151229');
    // stars
    const r = rnd(3); for (let i = 0; i < 70; i++) { const sx = r() * W, sy = r() * H * .45; ctx.globalAlpha = .3 + .5 * Math.abs(Math.sin(t * 1.3 + i)); ctx.fillStyle = '#fff'; ctx.fillRect(sx, sy, 1.6, 1.6); } ctx.globalAlpha = 1;
    // moon
    glow(1080, 110, 120, 'rgba(255,230,170,.35)'); ctx.fillStyle = '#FFF1C9'; ctx.beginPath(); ctx.arc(1080, 110, 34, 0, TAU); ctx.fill();
    ctx.fillStyle = '#0D1132'; ctx.beginPath(); ctx.arc(1094, 100, 30, 0, TAU); ctx.fill();
    skyline(560, '#1A1C3D', 11, .12, t);
    skyline(600, '#12142C', 5, .08, t);
    // street
    ctx.fillStyle = '#0C0D1C'; ctx.fillRect(0, 590, W, H - 590);
    // tea stall
    const sx = 230;
    ctx.fillStyle = '#3B2414'; ctx.fillRect(sx, 380, 300, 18);
    ctx.fillStyle = '#C2410C'; ctx.beginPath(); ctx.moveTo(sx - 30, 380); ctx.lineTo(sx + 330, 380); ctx.lineTo(sx + 300, 330); ctx.lineTo(sx, 330); ctx.fill();
    for (let i = 0; i < 6; i++) { ctx.fillStyle = i % 2 ? '#FDE68A' : '#C2410C'; ctx.beginPath(); ctx.moveTo(sx - 30 + i * 60, 380); ctx.lineTo(sx + 30 + i * 60, 380); ctx.lineTo(sx + i * 60, 404); ctx.fill(); }
    ctx.fillStyle = '#4A2D18'; ctx.fillRect(sx, 470, 300, 120); ctx.fillStyle = '#5B3A20'; ctx.fillRect(sx - 8, 460, 316, 16);
    ctx.fillStyle = '#2b1a0e'; ctx.fillRect(sx + 6, 398, 8, 64); ctx.fillRect(sx + 286, 398, 8, 64);
    // bulb
    const flick = .85 + .15 * Math.sin(t * 23) * Math.sin(t * 7);
    ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx + 150, 398); ctx.lineTo(sx + 150, 420); ctx.stroke();
    glow(sx + 150, 428, 260, 'rgba(255,190,90,.45)', flick);
    ctx.fillStyle = '#FFE6A8'; ctx.beginPath(); ctx.arc(sx + 150, 428, 9, 0, TAU); ctx.fill();
    // kettle + cups
    ctx.fillStyle = '#9CA3AF'; ctx.beginPath(); ctx.ellipse(sx + 70, 446, 26, 18, 0, 0, TAU); ctx.fill(); rr(sx + 58, 422, 24, 8, 3); ctx.fill();
    ctx.strokeStyle = '#9CA3AF'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(sx + 94, 444); ctx.lineTo(sx + 112, 430); ctx.stroke();
    for (let i = 0; i < 3; i++) { ctx.fillStyle = '#F5F5F4'; rr(sx + 160 + i * 34, 444, 18, 18, 3); ctx.fill(); }
    // steam
    for (let i = 0; i < 4; i++) { const k = (t * .6 + i / 4) % 1; ctx.globalAlpha = (1 - k) * .35; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(sx + 112, 428 - k * 70); ctx.quadraticCurveTo(sx + 112 + Math.sin(k * 8 + i) * 14, 410 - k * 80, sx + 112, 390 - k * 90); ctx.stroke(); }
    ctx.globalAlpha = 1;
    // bench
    ctx.fillStyle = '#3F2A1A'; rr(560, 528, 460, 16, 6); ctx.fill(); ctx.fillRect(580, 540, 10, 50); ctx.fillRect(990, 540, 10, 50);
    // friends
    const phoneK = eout(seg(t, 2.9, 3.5));
    const fr = [
      { x: 650, shirt: '#3B82F6', hair: '#111', skin: '#C68A60' },
      { x: 790, shirt: '#10B981', hair: '#2a1a12', skin: '#B97C55' },
      { x: 930, shirt: '#F59E0B', hair: '#151515', skin: '#D49A6E' },
    ];
    const happy = t > 3.7;
    fr.forEach((f, i) => person(f.x, 528, 1, { seated: true, shirt: f.shirt, hair: f.hair, skin: f.skin, happy, armUp: i === 1 ? phoneK : 0, look: t > 3.2 ? (i === 0 ? 3 : i === 2 ? -3 : 0) : 0 }));
    // falling rejection papers
    for (let i = 0; i < 7; i++) {
      const k = seg(t, .6 + i * .22, 2.9 + i * .1); if (k <= 0 || k >= 1) continue;
      const px = 120 + ((i * 173) % 1050), py = -40 + k * 700, rot = Math.sin(t * 3 + i) * .6;
      ctx.save(); ctx.translate(px, py); ctx.rotate(rot); ctx.globalAlpha = 1 - seg(t, 2.6, 3);
      ctx.fillStyle = '#F3F1EA'; ctx.fillRect(-22, -28, 44, 56);
      ctx.fillStyle = '#CBD5E1'; for (let l = 0; l < 4; l++) ctx.fillRect(-16, -20 + l * 9, 32, 3);
      ctx.strokeStyle = '#DC2626'; ctx.lineWidth = 3; ctx.strokeRect(-17, 4, 34, 16); text('✕', 0, 12, 13, '#DC2626');
      ctx.restore();
    }
    // thought bubbles: problems (0.4 - 2.9)
    const probs = [['💼', '2+ yrs exp?'], ['🎓', 'No reply'], ['💡', 'No funding']];
    probs.forEach((p, i) => {
      const k = back(seg(t, .4 + i * .45, .9 + i * .45)) * (1 - seg(t, 2.7, 3.0));
      if (k <= 0) return;
      const bx = fr[i].x, by = 330;
      ctx.save(); ctx.translate(bx, by); ctx.scale(k, k);
      ctx.fillStyle = 'rgba(255,255,255,.95)'; rr(-62, -40, 124, 70, 22); ctx.fill();
      ctx.beginPath(); ctx.arc(-10, 44, 7, 0, TAU); ctx.arc(-18, 58, 4, 0, TAU); ctx.fill();
      ctx.font = '30px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(p[0], 0, -14);
      text(p[1], 0, 14, 17, '#DC2626');
      ctx.restore();
    });
    // phone glow
    if (t > 3.0) {
      const px = 790 + 10, py = 528 - 72;
      const g = eio(seg(t, 3.2, 4.7));
      ctx.save(); ctx.fillStyle = '#111'; rr(px - 11, py - 20, 22, 36, 4); ctx.fill(); ctx.fillStyle = '#FFD45E'; rr(px - 9, py - 18, 18, 30, 3); ctx.fill(); ctx.restore();
      // rays
      ctx.save(); ctx.translate(px, py); ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 14; i++) { const a = i / 14 * TAU + t * .4; ctx.globalAlpha = .12 * g; ctx.fillStyle = '#FFC23D'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a - .05) * 900, Math.sin(a - .05) * 900); ctx.lineTo(Math.cos(a + .05) * 900, Math.sin(a + .05) * 900); ctx.fill(); }
      ctx.restore();
      glow(px, py, 80 + 900 * g * g, 'rgba(255,200,80,.9)', .4 + .6 * g);
    }
    ctx.restore();
    // white-gold flash
    const fl = seg(t, 4.3, 4.75) * (1 - seg(t, 4.75, 5.4));
    if (fl > 0) { ctx.fillStyle = `rgba(255,236,190,${fl})`; ctx.fillRect(0, 0, W, H); }
  }
  // ---- Beat C : deer + 3 paths (4.75 - 7.9)
  if (t >= 4.75 && t < 8.1) {
    const a = seg(t, 4.75, 5.2) * (1 - seg(t, 7.7, 8.1));
    ctx.save(); ctx.globalAlpha = a;
    bgGrad('#07081A', '#120B26');
    dust(t, 80, '#FFC23D', 9, 14);
    // horizon glow
    glow(W / 2, 640, 520, 'rgba(255,180,60,.25)');
    // three paths
    const ends = [[260, 210, '#3B82F6', '💼', 'JOB'], [640, 170, '#10B981', '🎓', 'INTERNSHIP'], [1020, 210, '#F59E0B', '🚀', 'STARTUP']];
    const pk = eio(seg(t, 5.7, 6.7));
    ends.forEach(([ex, ey, col, ic, lab], i) => {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const sx = 640, sy = 700; const cx = lerp(sx, ex, .5), cy = 520;
      ctx.strokeStyle = hexA(col, .9); ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.shadowColor = col; ctx.shadowBlur = 24;
      ctx.beginPath();
      const N = 40; for (let j = 0; j <= N * pk; j++) { const u = j / N; const x = (1 - u) * (1 - u) * sx + 2 * (1 - u) * u * cx + u * u * ex; const y = (1 - u) * (1 - u) * sy + 2 * (1 - u) * u * cy + u * u * (ey + 60); j ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.stroke(); ctx.restore();
      const pk2 = back(seg(t, 6.3 + i * .15, 6.9 + i * .15));
      if (pk2 > 0) {
        ctx.save(); ctx.translate(ex, ey); ctx.scale(pk2, pk2);
        glow(0, 0, 110, hexA(col, .55));
        ctx.fillStyle = 'rgba(10,10,20,.85)'; ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 48, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.font = '42px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(ic, 0, 3);
        text(lab, 0, 80, 22, '#fff', 'HindL', 700, 'center', 5);
        ctx.restore();
      }
      // friend walking along path
      const wk = eio(seg(t, 6.5, 7.8));
      if (wk > 0) {
        const u = .25 + wk * .6; const x = (1 - u) * (1 - u) * 640 + 2 * (1 - u) * u * lerp(640, ex, .5) + u * u * ex; const y = (1 - u) * (1 - u) * 700 + 2 * (1 - u) * u * 520 + u * u * (ey + 60);
        person(x, y - 30, .55 * (1 - wk * .45), { shirt: col, happy: true, walk: t * 12 + i, hair: '#151515' });
      }
    });
    // deer gallop across
    const dk = seg(t, 4.85, 6.4);
    if (dk > 0 && dk < 1) {
      const dx = lerp(-160, W + 160, eio(dk)), dy = 470 - Math.abs(Math.sin(dk * Math.PI * 3)) * 40;
      // trail
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 28; i++) { const k2 = dk - i * .012; if (k2 < 0) break; const tx = lerp(-160, W + 160, eio(k2)) - 20, ty = 470 - Math.abs(Math.sin(k2 * Math.PI * 3)) * 40 - 10; glow(tx, ty, 40 - i, 'rgba(255,200,80,.6)', 1 - i / 28); }
      ctx.restore();
      glow(dx, dy - 20, 160, 'rgba(255,200,90,.5)');
      deer(dx, dy, 1.25, t * 16);
    }
    ctx.restore();
  }
  // ---- Beat D : logo (7.7 - 10)
  if (t >= 7.7) {
    const a = seg(t, 7.7, 8.2) * (1 - seg(t, 9.5, 10));
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = '#05060B'; ctx.fillRect(0, 0, W, H);
    dust(t, 60, '#FFC23D', 4, 10);
    const k = back(seg(t, 7.8, 8.5));
    glow(W / 2, 250, 260 * k, 'rgba(255,190,70,.45)');
    deerMark(W / 2, 250, 130 * k);
    // shine sweep
    const sk = seg(t, 8.3, 9.0);
    ctx.save(); ctx.globalAlpha = a * clamp(seg(t, 8.0, 8.6));
    text('সোনারহরিণ', W / 2, 410, 92, '#FFD45E', 'Galada', 400);
    ctx.restore();
    ctx.globalAlpha = a * seg(t, 8.5, 9.0);
    text('S O N A R H O R I N', W / 2, 490, 22, 'rgba(255,255,255,.85)', 'HindL', 700);
    ctx.globalAlpha = a * seg(t, 8.8, 9.2);
    text('Your first golden chance', W / 2, 540, 24, 'rgba(255,210,120,.9)', 'HindL', 600);
